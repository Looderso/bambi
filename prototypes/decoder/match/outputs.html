<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bambi · Decoder · Outputs</title>
<link rel="stylesheet" href="../common.css">
<style>
  body{overflow:auto} main{max-width:720px;margin:0 auto;padding:16px}
  table{border-collapse:collapse;width:100%;margin:8px 0} td,th{border-top:1px solid var(--greyL);padding:6px 4px;text-align:left;font-size:10px;vertical-align:top}
  td button{flex:none;width:auto;margin:0 4px 4px 0}
  pre{font:10px/1.4 Menlo,monospace;white-space:pre-wrap;background:var(--panel);padding:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<main>
  <h1>Decoder · Outputs</h1>
  <p class="note">Five ways a page can send sound to a chosen device. Each button plays a quiet one-second beep
    (−30 dBFS) on that device by one way only. Note where you hear each — and read the log out.</p>
  <div class="row"><button id="bList" class="go">List devices</button></div>
  <table id="devices"><tr><th>device</th><th>play by</th></tr></table>
  <pre id="log"></pre>
</main>
<script src="../common.js"></script>
<script>
"use strict";
const SR = 48000;
const log = s => { $("log").textContent += s + "\n"; };
log("browser: " + navigator.userAgent);
log("AudioContext.setSinkId: " + typeof AudioContext.prototype.setSinkId + ", HTMLMediaElement.setSinkId: " + typeof HTMLMediaElement.prototype.setSinkId);

// A one-second 660 Hz beep, faded, at −30 dBFS RMS.
function beepBuffer(ctx) {
  const b = ctx.createBuffer(1, SR, SR), x = b.getChannelData(0);
  for (let i = 0; i < SR; i++) { const t = i / SR; x[i] = Math.sin(2 * Math.PI * 660 * t) * Math.min(1, t / 0.02, (1 - t) / 0.02); }
  return normalizeRms(b);
}
function beepWav() {
  const off = new OfflineAudioContext(1, SR, SR), x = beepBuffer(off).getChannelData(0);
  const buf = new ArrayBuffer(44 + x.length * 2), v = new DataView(buf);
  const s = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); v.setUint32(4, 36 + x.length * 2, true); s(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  s(36, "data"); v.setUint32(40, x.length * 2, true);
  x.forEach((y, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, y)) * 32767, true));
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
async function playContext(ctx, label) {
  const src = ctx.createBufferSource(); src.buffer = beepBuffer(ctx); src.connect(safeOutput(ctx)); src.start();
  log(`${label}: playing, context sinkId now "${typeof ctx.sinkId === "string" ? ctx.sinkId : JSON.stringify(ctx.sinkId)}"`);
  setTimeout(() => ctx.close(), 1500);
}
const METHODS = {
  "new context": async (id, name) => {
    const ctx = new AudioContext({ sampleRate: SR, sinkId: id });
    await ctx.resume(); await playContext(ctx, `new AudioContext({sinkId}) → ${name}`);
  },
  "switched context": async (id, name) => {
    const ctx = new AudioContext({ sampleRate: SR }); await ctx.resume();
    await ctx.setSinkId(id); await playContext(ctx, `AudioContext.setSinkId → ${name}`);
  },
  // Live: a context's output carried to an <audio> element as a MediaStream — what live, head-tracked sound needs.
  "live, set before play": async (id, name) => {
    const ctx = new AudioContext({ sampleRate: SR }), dest = ctx.createMediaStreamDestination();
    const el = new Audio(); await el.setSinkId(id); el.srcObject = dest.stream; await el.play(); await ctx.resume();
    const src = ctx.createBufferSource(); src.buffer = beepBuffer(ctx); src.connect(safeOutput(ctx, dest)); src.start();
    log(`live stream, sink set before play → ${name}: playing, element sinkId "${el.sinkId}"`);
    setTimeout(() => { el.pause(); ctx.close(); }, 1500);
  },
  "live, set after play": async (id, name) => {
    const ctx = new AudioContext({ sampleRate: SR }), dest = ctx.createMediaStreamDestination();
    const el = new Audio(); el.srcObject = dest.stream; await el.play(); await ctx.resume(); await el.setSinkId(id);
    const src = ctx.createBufferSource(); src.buffer = beepBuffer(ctx); src.connect(safeOutput(ctx, dest)); src.start();
    log(`live stream, sink set after play → ${name}: playing, element sinkId "${el.sinkId}"`);
    setTimeout(() => { el.pause(); ctx.close(); }, 1500);
  },
  "audio element": async (id, name) => {
    const el = new Audio(beepWav()); await el.setSinkId(id); await el.play();
    log(`<audio> + setSinkId → ${name}: playing, element sinkId now "${el.sinkId}"`);
  },
};
$("bList").onclick = async () => {
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); log("microphone permission: granted"); }
  catch (e) { log("microphone permission: " + e.name + " — " + e.message); }
  const outs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audiooutput");
  log(`outputs: ${outs.length}`); outs.forEach(d => log(`  "${d.label || "(no name)"}" id ${d.deviceId ? d.deviceId.slice(0, 12) + "…" : "(empty)"}`));
  const table = $("devices"); table.innerHTML = "<tr><th>device</th><th>play by</th></tr>";
  for (const d of outs) {
    const tr = document.createElement("tr"); tr.innerHTML = `<td>${d.label || "(no name)"}</td><td></td>`;
    for (const [m, fn] of Object.entries(METHODS)) {
      const b = document.createElement("button"); b.textContent = m;
      b.onclick = () => fn(d.deviceId, d.label || d.deviceId).catch(e => log(`${m} → ${d.label}: ${e.name} — ${e.message}`));
      tr.children[1].appendChild(b);
    }
    table.appendChild(tr);
  }
};
</script>
</body>
</html>
