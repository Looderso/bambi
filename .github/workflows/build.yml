#  Every push and pull request: the repository's checks, core's tests on three systems, and the plugins built
#  and checked on three systems. A tag `v*` also publishes the plugins as a release, the macOS download signed and
#  notarised with an installer that carries the live host; a run started by hand builds that installer too.
#
#  Link-time optimisation makes a JUCE link need a lot of memory, so links run two at a time, and ccache keeps
#  what did not change from being compiled again.

name: build

#  A change to documentation or agent context alone builds nothing: docs.yml checks it.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**", ".claude/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: style, layers, format, notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: pipx install clang-format==23.1.1
      - run: tools/check-style.sh
      - run: tools/check-layers.sh
      - run: tools/format.sh --check
      - run: tools/release/notices.py --check

  core:
    name: core · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      #  Unchanged files are not compiled again between runs; the build finds ccache on the path.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: core-${{ matrix.os }}
      - run: cmake -B build -G Ninja
      - run: cmake --build build
      - run: ./build/bambi-tests
        shell: bash
      #  The audio hashes are one toolchain's (Apple clang, arm64); the other systems have no manifest.
      - if: runner.os == 'macOS'
        run: tools/golden.sh

  plugins:
    name: plugins · ${{ matrix.os }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: macos
            options: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - os: windows-latest
            system: windows
          - os: ubuntu-latest
            system: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: plugins-${{ matrix.os }}
          max-size: 2G
      - name: configure
        shell: bash
        run: >
          cmake -B build-plugin -G Ninja -DBAMBI_BUILD_PLUGIN=ON -DBAMBI_COPY_PLUGIN=OFF
          -DCMAKE_JOB_POOLS=link=2 -DCMAKE_JOB_POOL_LINK=link "${{ matrix.options }}"
      - run: cmake --build build-plugin
      - name: check suites
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          suite() { echo "build-plugin/plugins/$1/$2_artefacts/Release/$2"; }
          run "$(suite encoder bambi-plugin-check)"
          run "$(suite echo bambi-echo-check)"
          run "$(suite reverb bambi-reverb-check)"
          run "$(suite decoder bambi-decoder-check)"
      - name: collect
        shell: bash
        run: |
          mkdir -p out/VST3 out/CLAP
          #  folder:target:name -- the Encoder's folder and target keep the old word, its bundles the new name
          for p in "encoder:Encoder:Path Encoder" "echo:Echo:Echo" "reverb:Reverb:Reverb" "decoder:Decoder:Decoder"; do
            IFS=: read -r folder target name <<< "$p"
            dir="build-plugin/plugins/$folder/Bambi${target}_artefacts/Release"
            cp -R "$dir/VST3/bambi $name.vst3" out/VST3/
            cp -R "$dir/CLAP/bambi $name.clap" out/CLAP/
          done
          cp "tools/release/INSTALL-${{ matrix.system }}.txt" out/INSTALL.txt
          cp LICENSE LICENSE-AGPL-3.0.md THIRD-PARTY-NOTICES.txt out/
      #  Zipped here, not by the upload: an artifact loses file permissions, and a macOS bundle's executable
      #  would arrive unable to run. Named without the version, so
      #  .../releases/latest/download/bambi-macos.zip always means the newest.
      - name: zip
        shell: bash
        run: |
          cd out
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip -bso0 "../bambi-${{ matrix.system }}.zip" .; else zip -qry "../bambi-${{ matrix.system }}.zip" .; fi
      - uses: actions/upload-artifact@v7
        with:
          name: bambi-${{ matrix.system }}
          path: bambi-${{ matrix.system }}.zip

  #  The macOS download signed and notarised, with an installer that also carries the live host and its loop driver.
  #  On a tag, and on a run started by hand, which tries it before a release; never on a pull request. It replaces
  #  the plugins job's macOS zip with the signed one.
  macos-package:
    name: package · macos
    needs: plugins
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: brew install ninja
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: plugins-macos-latest
          max-size: 2G
      - uses: actions/download-artifact@v8
        with:
          name: bambi-macos
      - run: mkdir plugins && ditto -x -k bambi-macos.zip plugins
      - name: live host
        run: |
          cmake -B build-plugin -G Ninja -DBAMBI_BUILD_PLUGIN=ON -DBAMBI_BUILD_HOST=ON -DBAMBI_COPY_PLUGIN=OFF \
            -DCMAKE_JOB_POOLS=link=2 -DCMAKE_JOB_POOL_LINK=link "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build-plugin --target bambi-live-host
      - run: driver/build.sh
      - name: sign, package, notarise
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export "$(tools/release/macos/keychain.sh)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-${GITHUB_SHA::7}; fi
          tools/release/macos/package.sh dist plugins \
            "build-plugin/apps/live-host/bambi-live-host_artefacts/Release/bambi live host.app" \
            driver/build/bambi.driver "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: bambi-macos
          path: dist/bambi-macos.*
          overwrite: true

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, plugins, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      #  The binaries are AGPLv3, which obliges the complete corresponding source beside them: JUCE included,
      #  which GitHub's own source archive of a tag leaves out.
      #  The loop driver's source too: BlackHole at its pin, which the build fetches rather than the repository holding.
      - name: source
        run: |
          driver/build.sh source
          { git ls-files --recurse-submodules -z; find driver/BlackHole -name .git -prune -o -type f -print0; } |
            tar --null -T - --transform "s|^|bambi-${GITHUB_REF_NAME}/|" -czf "bambi-${GITHUB_REF_NAME}-source.tar.gz"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/bambi-*.zip
            artifacts/bambi-*.pkg
            bambi-*-source.tar.gz
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
