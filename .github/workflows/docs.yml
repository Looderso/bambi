#  Documentation and agent context: every link resolves, every decision referenced exists, every page stays
#  inside its size budget. Seconds, with no build.

name: docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "docs/**", ".claude/**", "tools/check-docs.sh"]
  pull_request:
    paths: ["**/*.md", "docs/**", ".claude/**", "tools/check-docs.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: links, decisions, sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-docs.sh
