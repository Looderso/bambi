#  Documentation and agent context: every link resolves, every decision referenced exists, every page stays
#  inside its size budget. Seconds, with no build.

name: docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "docs/**", ".claude/**", "tools/check-docs.sh", "lychee.toml"]
  pull_request:
    paths: ["**/*.md", "docs/**", ".claude/**", "tools/check-docs.sh", "lychee.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: links, decisions, sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml 'docs/**/*.md' '*.md' '**/AGENTS.md' '.claude/**/*.md'
      - run: tools/check-docs.sh --skip-links
